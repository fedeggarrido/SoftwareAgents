# Preferencias declarativas de executor por capabilityClass (orden). Sin nombres de modelo:
# el modelo y el esfuerzo por tarea los decide la config del operador (SA-084).
high_reasoning:
  - executor: claude
  - executor: codex
standard_coding:
  - executor: codex
  - executor: claude
fast_cheap:
  - executor: claude
  - executor: codex
review:
  - executor: claude
  - executor: codex

# Pesos sumados; si falta tipo o tamaño se usa solo capabilityClass.
tierRule:
  capabilityWeights:
    { fast_cheap: 0, standard_coding: 2, review: 2, test_analysis: 2, high_reasoning: 4 }
  workTypeWeights:
    { summary: 0, classification: 0, docs: 0, implementation: 0, review: 1, qa: 1, architecture: 2 }
  sizeWeights: { S: 0, M: 1, L: 2 }
  thresholds: { economy: 0, standard: 2, deep: 4 }
