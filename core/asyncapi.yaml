# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our 52 named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Pixel Agents Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Pixel Agents server and any UI client
    (the bundled VS Code webview, the standalone browser SPA, or future third-party
    clients). The server watches AI-coding-agent transcripts, parses tool activity, 
    owns office layout, and streams events to all connected clients. 
    Clients send commands to launch agents, save layout, and toggle settings.

    The protocol is provider-agnostic: a HookProvider implementation defines how raw
    CLI events are normalized to the AgentEvent shape, which the server translates
    into ServerMessage broadcasts.
  license:
    name: MIT
  contact:
    name: Pixel Agents
    url: https://github.com/pablodelucca/pixel-agents

servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local Pixel Agents server (default port 3100)
    pathname: /ws

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on agent
      lifecycle, tool activity, asset loading, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        - $ref: '#/components/schemas/FeaturesSnapshot'
        - $ref: '#/components/schemas/AuditLogSnapshot'
        # Provider capabilities
        - $ref: '#/components/schemas/ProviderCapabilities'
        # Agent lifecycle
        - $ref: '#/components/schemas/AgentCreated'
        - $ref: '#/components/schemas/AgentClosed'
        - $ref: '#/components/schemas/AgentSelected'
        - $ref: '#/components/schemas/ExistingAgents'
        # Agent status / tool activity
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolStart'
        - $ref: '#/components/schemas/AgentToolDone'
        - $ref: '#/components/schemas/AgentToolsClear'
        - $ref: '#/components/schemas/AgentToolPermission'
        - $ref: '#/components/schemas/AgentToolPermissionClear'
        # Sub-agent activity
        - $ref: '#/components/schemas/SubagentToolStart'
        - $ref: '#/components/schemas/SubagentToolDone'
        - $ref: '#/components/schemas/SubagentClear'
        - $ref: '#/components/schemas/SubagentToolPermission'
        # Agent Teams
        - $ref: '#/components/schemas/AgentTeamInfo'
        # Context window
        - $ref: '#/components/schemas/AgentContextUsage'
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        - $ref: '#/components/schemas/CarpetTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/HooksStatus'
        - $ref: '#/components/schemas/HooksConsentRequest'
        - $ref: '#/components/schemas/ExternalAssetDirectoriesUpdated'
        - $ref: '#/components/schemas/AreaMappingsLoaded'
        - $ref: '#/components/schemas/WorkspaceFolders'
        # Company board and agent identity
        - $ref: '#/components/schemas/BoardState'
        - $ref: '#/components/schemas/AgentRole'
        - $ref: '#/components/schemas/AgentProviderLabel'
        - $ref: '#/components/schemas/CompanyNotice'
        # Executor availability (SA-087)
        - $ref: '#/components/schemas/ExecutorState'
        - $ref: '#/components/schemas/ExecutorToggleResult'
        # Work domain events (SA-029)
        - $ref: '#/components/schemas/WorkSnapshot'
        - $ref: '#/components/schemas/DomainEventMessage'
        # Diagnostics
        - $ref: '#/components/schemas/AgentDiagnostics'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/RequestFeatures'
        - $ref: '#/components/schemas/RequestAuditLog'
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/LaunchAgent'
        - $ref: '#/components/schemas/FocusAgent'
        - $ref: '#/components/schemas/CloseAgent'
        - $ref: '#/components/schemas/SaveAgentSeats'
        - $ref: '#/components/schemas/SaveLayout'
        - $ref: '#/components/schemas/SetSoundEnabled'
        - $ref: '#/components/schemas/SetLastSeenVersion'
        - $ref: '#/components/schemas/SetAlwaysShowLabels'
        - $ref: '#/components/schemas/SetGhostHeadlessAgents'
        - $ref: '#/components/schemas/SetHooksEnabled'
        - $ref: '#/components/schemas/HooksConsentResponse'
        - $ref: '#/components/schemas/SetHooksInfoShown'
        - $ref: '#/components/schemas/SetWatchAllSessions'
        - $ref: '#/components/schemas/ExportLayout'
        - $ref: '#/components/schemas/ImportLayout'
        - $ref: '#/components/schemas/OpenSessionsFolder'
        - $ref: '#/components/schemas/AddExternalAssetDirectory'
        - $ref: '#/components/schemas/RemoveExternalAssetDirectory'
        - $ref: '#/components/schemas/SaveAreaMappings'
        - $ref: '#/components/schemas/SetShowAreas'
        - $ref: '#/components/schemas/RequestDiagnostics'
        - $ref: '#/components/schemas/CompanyAutopilot'
        - $ref: '#/components/schemas/CompanyDecision'
        - $ref: '#/components/schemas/SetExecutorEnabled'
        - $ref: '#/components/schemas/SetExecutorLevels'
        - $ref: '#/components/schemas/RequestExecutorState'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    RequestFeatures:
      description: Read-only WorkStore projection; same existing connection privilege and bound-Project guard as requestAuditLog. No new authority or mutation.
      type: object
      additionalProperties: false
      required: [type, projectId, requestId]
      properties:
        type:
          const: requestFeatures
        projectId:
          type: string
        requestId:
          type: string

    FeaturesSnapshot:
      description: |
        Point-to-point read-only reply, never broadcast. Echoes projectId/requestId;
        clients discard obsolete requests or Projects. denied, unknown_project,
        read_error and empty carry no features. Only read_error carries a fixed
        reason code; other statuses use null. No raw exception details or private
        WorkStore payloads. Free text must be sanitized and rendered as text.
      type: object
      additionalProperties: false
      required: [type, projectId, requestId, status, reason, features]
      properties:
        type:
          const: featuresSnapshot
        projectId:
          type: string
        requestId:
          type: string
        status:
          $ref: '#/components/schemas/FeaturesStatus'
        reason:
          oneOf:
            - $ref: '#/components/schemas/FeaturesReadError'
            - type: 'null'
        features:
          type: array
          items:
            $ref: '#/components/schemas/FeatureRow'

    FeatureRow:
      description: Sanitized display projection only; no paths, process identities, prompts, answers, command outputs, remote URLs, secrets or reports.
      type: object
      additionalProperties: false
      required:
        [
          key,
          title,
          state,
          rawStatus,
          progress,
          currentTask,
          gates,
          integration,
          lastActivityAt,
          cost,
        ]
      properties:
        key:
          type: string
        title:
          type: [string, 'null']
        state:
          $ref: '#/components/schemas/FeatureState'
        rawStatus:
          type: [string, 'null']
        progress:
          oneOf:
            - $ref: '#/components/schemas/FeatureProgress'
            - type: 'null'
        currentTask:
          oneOf:
            - $ref: '#/components/schemas/FeatureCurrentTask'
            - type: 'null'
        gates:
          type: array
          items:
            $ref: '#/components/schemas/FeatureGate'
        integration:
          oneOf:
            - $ref: '#/components/schemas/FeatureIntegration'
            - type: 'null'
        lastActivityAt:
          type: [string, 'null']
        cost:
          $ref: '#/components/schemas/FeatureCost'
        flow:
          type: string

    FeatureCost:
      type: object
      additionalProperties: false
      required: [executions, costKnown, costUsd, costPerDoneTaskUsd, cacheHitRate]
      properties:
        executions:
          type: integer
          minimum: 0
        costKnown:
          type: integer
          minimum: 0
        costUsd:
          type: [number, 'null']
        costPerDoneTaskUsd:
          type: [number, 'null']
        cacheHitRate:
          type: [number, 'null']

    FeatureProgress:
      type: object
      additionalProperties: false
      required: [done, total]
      properties:
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0

    FeatureCurrentTask:
      type: object
      additionalProperties: false
      required: [key, step, others]
      properties:
        key:
          type: string
        step:
          oneOf:
            - $ref: '#/components/schemas/FeatureTaskStep'
            - type: 'null'
        others:
          type: integer
          minimum: 0

    FeatureGate:
      type: object
      additionalProperties: false
      required: [kind, task, expired, command]
      properties:
        kind:
          $ref: '#/components/schemas/FeatureGateKind'
        task:
          type: [string, 'null']
        expired:
          type: boolean
        command:
          description: Relative command for the operator to run manually; answers use the literal <fichero-de-respuestas> placeholder.
          type: string
        reason:
          description: Sanitized display-only explanation of a gate or advisory.
          type: string

    FeatureIntegration:
      type: object
      additionalProperties: false
      required: [branch, sha]
      properties:
        branch:
          type: string
        sha:
          type: [string, 'null']

    FeaturesStatus:
      type: string
      enum: [ok, empty, denied, unknown_project, read_error]

    FeaturesReadError:
      type: string
      enum: [unavailable, schema_incompatible, query_failed, invalid_data]

    FeatureState:
      type: string
      enum: [merged, ready_to_merge, in_review, in_design, in_development, unknown]

    FeatureTaskStep:
      type: string
      enum: [develop, review, qa]

    FeatureGateKind:
      type: string
      enum:
        [
          spec_approval,
          requirements_questions,
          design_questions,
          human_decision,
          waiting_human,
          quota,
          qa_not_tested,
          zone_overlap,
        ]

    RequestAuditLog:
      description: Pure read of the bound Project audit log; requires existing connection privilege.
      type: object
      additionalProperties: false
      required: [type, projectId, requestId]
      properties:
        type:
          const: requestAuditLog
        projectId:
          type: string
        requestId:
          type: string

    AuditLogStatus:
      type: string
      enum: [ok, empty, read_error, denied, unknown_project]

    AuditLogSnapshot:
      description: |
        Point-to-point reply, never broadcast. denied, unknown_project and read_error
        contain no entries, counts or corrupt line numbers. Echoes both request IDs.
        Clients discard replies for an obsolete request or selected Project.
      type: object
      additionalProperties: false
      required:
        - type
        - projectId
        - requestId
        - status
        - entries
        - totalValid
        - truncated
        - corruptLines
        - excludedCount
      properties:
        type:
          const: auditLog
        projectId:
          type: string
        requestId:
          type: string
        status:
          $ref: '#/components/schemas/AuditLogStatus'
        entries:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/AuditViewEntry'
        totalValid:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        corruptLines:
          type: array
          items:
            type: integer
            minimum: 1
        excludedCount:
          type: integer
          minimum: 0

    AuditViewEntry:
      description: Redacted display projection; never contains inputHash or raw corrupt content.
      type: object
      additionalProperties: false
      required:
        - line
        - occurredAt
        - actorType
        - actorId
        - action
        - resourceType
        - resourceId
        - policyDecision
        - riskLevel
        - outcome
        - taskKey
        - executionId
      properties:
        line:
          type: integer
          minimum: 1
        occurredAt:
          type: string
        actorType:
          type: string
        actorId:
          type: [string, 'null']
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: [string, 'null']
        policyDecision:
          oneOf:
            - $ref: '#/components/schemas/AuditViewPolicyDecision'
            - type: 'null'
        riskLevel:
          type: string
        outcome:
          $ref: '#/components/schemas/AuditViewOutcome'
        taskKey:
          type: [string, 'null']
        executionId:
          type: [string, 'null']

    AuditViewPolicyDecision:
      type: object
      additionalProperties: false
      required: [outcome, reason]
      properties:
        outcome:
          type: string
        reason:
          type: string

    AuditViewOutcome:
      type: object
      additionalProperties: false
      required: [status, reason, detail, tier, executor, model, code]
      properties:
        status:
          type: string
        reason:
          type: [string, 'null']
        detail:
          type: [string, 'null']
        tier:
          type: [string, 'null']
        executor:
          type: [string, 'null']
        model:
          type: [string, 'null']
        code:
          type: [string, 'null']

    ProviderCapabilities:
      description: |
        Sent once after `webviewReady`, before any agent messages. Tells the client
        which tool names should render with the "reading" animation and which spawn
        sub-agent characters.
      type: object
      additionalProperties: false
      required: [type, readingTools, subagentToolNames]
      properties:
        type:
          const: providerCapabilities
        readingTools:
          type: array
          items:
            type: string
          description: Tool names that should render the reading animation (vs typing).
        subagentToolNames:
          type: array
          items:
            type: string
          description: Tool names that spawn sub-agent characters (e.g. Task, Agent).

    AgentCreated:
      description: A new agent has appeared in the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentCreated
        projectId:
          type: string
          description: Project membership derived by the server from session location.
        id:
          type: integer
        folderName:
          type: string
        isExternal:
          type: boolean
        palette:
          type: integer
          description: Server-assigned character palette index.
        hueShift:
          type: integer
          description: Server-assigned hue shift in degrees (0-360).

    AgentClosed:
      description: An agent has been removed from the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentClosed
        id:
          type: integer

    AgentSelected:
      description: An agent's terminal was focused (VS Code only). UI should highlight it.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentSelected
        id:
          type: integer

    ExistingAgents:
      description: |
        Snapshot of all current agents. Sent on initial connect and after agent set
        changes that the client missed. Includes seat/palette assignments.
      type: object
      additionalProperties: false
      required: [type, agents, agentMeta, folderNames, externalAgents]
      properties:
        type:
          const: existingAgents
        agents:
          type: array
          items:
            type: integer
        agentMeta:
          type: object
          description: Map of agent ID (string) to seat metadata.
          additionalProperties:
            $ref: '#/components/schemas/AgentSeatMeta'
        folderNames:
          type: object
          description: Map of agent ID (string) to workspace folder name.
          additionalProperties:
            type: string
        externalAgents:
          type: object
          description: Map of agent ID (string) to external flag.
          additionalProperties:
            type: boolean

    AgentStatus:
      description: Active vs waiting state for an agent (drives character animation).
      type: object
      additionalProperties: false
      required: [type, id, status]
      properties:
        type:
          const: agentStatus
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        awaitingInput:
          type: boolean
          description: >-
            Only meaningful when status is "waiting". True when the agent went
            idle waiting on the user (drives the "Waiting for input" label);
            absent/false means the agent finished its turn ("Done").

    AgentActivityStatus:
      description: Activity state of an agent.
      type: string
      enum: [active, waiting]

    AgentToolStart:
      description: Agent began executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId, status]
      properties:
        type:
          const: agentToolStart
        id:
          type: integer
        toolId:
          type: string
        status:
          type: string
          description: Human-readable status to display (e.g. "Reading foo.ts").
        toolName:
          type: string
        permissionActive:
          type: boolean
        runInBackground:
          type: boolean
        isTeammateSpawn:
          type: boolean
          description: >-
            True when this spawn tool call carries a name, making the spawn a
            Teammate-to-be. The office must not create a Subtask sub-character
            for it — a teammate character will represent the spawn instead.

    AgentToolDone:
      description: Agent finished executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId]
      properties:
        type:
          const: agentToolDone
        id:
          type: integer
        toolId:
          type: string

    AgentToolsClear:
      description: All foreground tools cleared (turn end). Background agents preserved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolsClear
        id:
          type: integer

    AgentToolPermission:
      description: Permission prompt detected for the agent's current tool.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermission
        id:
          type: integer

    AgentToolPermissionClear:
      description: Permission prompt resolved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermissionClear
        id:
          type: integer

    SubagentToolStart:
      description: Sub-agent (e.g. Task) started a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId, status]
      properties:
        type:
          const: subagentToolStart
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string
        status:
          type: string

    SubagentToolDone:
      description: Sub-agent finished a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId]
      properties:
        type:
          const: subagentToolDone
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentClear:
      description: A sub-agent task completed.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentClear
        id:
          type: integer
        parentToolId:
          type: string

    SubagentToolPermission:
      description: Permission prompt for a sub-agent's tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentToolPermission
        id:
          type: integer
        parentToolId:
          type: string

    AgentTeamInfo:
      description: Agent Teams metadata (lead, teammate, tmux usage).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTeamInfo
        id:
          type: integer
        teamName:
          type: string
        agentName:
          type: string
        isTeamLead:
          type: boolean
        leadAgentId:
          type: integer
        teamUsesTmux:
          type: boolean

    AgentContextUsage:
      description: |
        How much of the agent's context window is in use, as of its most recent
        turn. A snapshot, NOT a running total: it falls when the session
        compacts or clears. `maxContextTokens` is the runtime's best estimate of
        the window size — transcripts don't state it, so it starts at the
        default and widens (never shrinks) once a larger context is observed.
        Sent for every agent, including leads and teammates; sub-agents have no
        session of their own and never report it.
      type: object
      additionalProperties: false
      required: [type, id, contextTokens, maxContextTokens]
      properties:
        type:
          const: agentContextUsage
        id:
          type: integer
        contextTokens:
          type: integer
        maxContextTokens:
          type: integer

    LayoutLoaded:
      description: |
        Office layout (tiles, furniture, colors). `null` when no layout file or
        bundled default exists. `wasReset` is true when the bundled default
        replaced an outdated user layout.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: layoutLoaded
        layout:
          oneOf:
            - type: object
              description: |
                Opaque layout object (cols, rows, tiles, furniture, tileColors).
                Format defined by the OfficeLayout schema in webview-ui; not
                modeled here because it's owned by the rendering layer.
            - type: 'null'
        wasReset:
          type: boolean

    FurnitureAssetsLoaded:
      description: Furniture catalog and sprite data, sent once after webviewReady.
      type: object
      additionalProperties: false
      required: [type, catalog, sprites]
      properties:
        type:
          const: furnitureAssetsLoaded
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureAssetMessage'
        sprites:
          type: object
          description: Map of furniture asset ID to its sprite (2D hex string array).
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string

    CharacterSpritesLoaded:
      description: Pre-colored character sprite sets (6 palettes), sent once at startup.
      type: object
      additionalProperties: false
      required: [type, characters]
      properties:
        type:
          const: characterSpritesLoaded
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSpriteSet'

    PetSpritesLoaded:
      description: Pet sprite frame sets and display names, sent once after webviewReady (between characterSpritesLoaded and floorTilesLoaded).
      type: object
      additionalProperties: false
      required: [type, pets, petNames]
      properties:
        type:
          const: petSpritesLoaded
        pets:
          type: array
          description: One frame-set per loaded pet, indexed by petType.
          items:
            $ref: '#/components/schemas/PetSpriteFrameSet'
        petNames:
          type: array
          description: Display names parallel-indexed to `pets` (sourced from each pet's manifest.json).
          items:
            type: string

    PetSpriteFrameSet:
      description: One pet's frames keyed by direction + state. All arrays are 3D hex-string arrays (frames × rows × pixels).
      type: object
      additionalProperties: false
      required: [walkDown, idleDown, walkUp, idleUp, walkRight]
      properties:
        walkDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkRight:
          type: array
          description: 3 frames at 32×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FloorTilesLoaded:
      description: Floor tile sprites (7 patterns).
      type: object
      additionalProperties: false
      required: [type, sprites]
      properties:
        type:
          const: floorTilesLoaded
        sprites:
          type: array
          description: Array of 2D hex string arrays (one per pattern).
          items:
            type: array
            items:
              type: array
              items:
                type: string

    WallTilesLoaded:
      description: Wall auto-tile sprite sets (16 bitmask pieces).
      type: object
