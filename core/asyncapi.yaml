      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDiagnostics

    CompanyAutopilot:
      description: Turn the agent company's autopilot on or off (privileged clients only; declared by the workspace's docs/backlog/board.json).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: companyAutopilot
        enabled:
          type: boolean

    CompanyDecision:
      description: Answer an owner decision of the agent company with one of its listed options (privileged clients only).
      type: object
      additionalProperties: false
      required: [type, id, answer]
      properties:
        type:
          const: companyDecision
        id:
          type: string
        answer:
          type: string

    SetExecutorEnabled:
      description: |
        Operator command (privileged clients only): make an Executor available or
        unavailable for NEW Executions of a Project. An absolute state, never a
        toggle — repeating it cannot invert it. It never assigns a Task, picks a
        Model or bypasses a gate: the selector still decides who does what.
        Answered point-to-point with executorToggleResult.
      type: object
      additionalProperties: false
      required: [type, projectId, executorId, enabled, requestId, expectedRevision]
      properties:
        type:
          const: setExecutorEnabled
        projectId:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 64
        executorId:
          $ref: '#/components/schemas/ExecutorId'
        enabled:
          type: boolean
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        expectedRevision:
          type: string
          minLength: 1
          maxLength: 128
          description: Opaque revision from the last executorState; a stale one is a revision_conflict.

    SetExecutorLevels:
      description: |
        Operator command (privileged clients only, SA-092): the model tiers an
        Executor may run for NEW Executions of a Project. An absolute state: levels
        is the complete allowed set, a subset of that Executor's catalogLevels;
        listing every catalog level removes the restriction, an empty list blocks
        the Executor at every level. It only narrows what the Operator catalog
        already offers: it never adds a candidate, assigns a Task or picks a Model,
        and a disallowed level never downgrades a Task to a lower one. Same service,
        policy, audit and recovery as setExecutorEnabled; answered point-to-point
        with executorToggleResult.
      type: object
      additionalProperties: false
      required: [type, projectId, executorId, levels, requestId, expectedRevision]
      properties:
        type:
          const: setExecutorLevels
        projectId:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 64
        executorId:
          $ref: '#/components/schemas/ExecutorId'
        levels:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ModelTier'
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        expectedRevision:
          type: string
          minLength: 1
          maxLength: 128
          description: Opaque revision from the last executorState; a stale one is a revision_conflict.

    RequestExecutorState:
      description: Ask for a fresh executorState of the server's own Project (reconnect/resync). Read-only and cheap; never starts probes.
      type: object
      additionalProperties: false
      required: [type, projectId]
      properties:
        type:
          const: requestExecutorState
        projectId:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 64

